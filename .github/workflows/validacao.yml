name: validacao

on:
  pull_request:
  push:

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify backend workspace
        shell: bash
        run: test -d apps/backend

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Verify backend with PostgreSQL Testcontainers
        working-directory: apps/backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frontend workspace
        shell: bash
        run: test -d apps/frontend

      - name: Run frontend checks when bootstrapped
        shell: bash
        run: |
          if [ -f apps/frontend/package.json ]; then
            (cd apps/frontend && npm ci && npm run lint && npm test -- --run && npm run build)
          else
            echo "Frontend bootstrap not implemented yet; no Node checks to run."
          fi

  e2e-integrado:
    name: e2e-integrado
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        shell: bash
        run: docker compose --env-file .env.example -f infra/compose.yaml config --quiet

      - name: Run E2E checks when bootstrapped
        shell: bash
        run: |
          if [ -f apps/frontend/package.json ] && grep -q '"e2e"' apps/frontend/package.json; then
            (cd apps/frontend && npm ci && npm run e2e)
          else
            echo "E2E bootstrap not implemented yet; Compose validation is the integrated gate for now."
          fi
