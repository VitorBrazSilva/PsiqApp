name: validacao

on:
  pull_request:
  push:

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify backend workspace
        shell: bash
        run: test -d apps/backend

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Verify backend with PostgreSQL Testcontainers
        working-directory: apps/backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frontend workspace
        shell: bash
        run: test -d apps/frontend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Check frontend types
        working-directory: apps/frontend
        run: npm run typecheck

      - name: Lint frontend
        working-directory: apps/frontend
        run: npm run lint

      - name: Test frontend
        working-directory: apps/frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

  e2e-integrado:
    name: e2e-integrado
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        shell: bash
        run: docker compose --env-file .env.example -f infra/compose.yaml config --quiet

      - name: Run E2E checks when bootstrapped
        shell: bash
        run: |
          if [ -f apps/frontend/package.json ] && grep -q '"e2e"' apps/frontend/package.json; then
            (cd apps/frontend && npm ci && npm run e2e)
          else
            echo "E2E bootstrap not implemented yet; Compose validation is the integrated gate for now."
          fi
