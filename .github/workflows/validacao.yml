name: validacao

on:
  pull_request:
  push:

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify backend workspace
        shell: bash
        run: test -d apps/backend

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Verify backend with PostgreSQL Testcontainers
        working-directory: apps/backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frontend workspace
        shell: bash
        run: test -d apps/frontend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Check frontend types
        working-directory: apps/frontend
        run: npm run typecheck

      - name: Lint frontend
        working-directory: apps/frontend
        run: npm run lint

      - name: Test frontend
        working-directory: apps/frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

  e2e-integrado:
    name: e2e-integrado
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Validate Docker Compose
        shell: bash
        run: docker compose --env-file .env.example -f infra/compose.yaml config --quiet

      - name: Install frontend dependencies and Chromium
        working-directory: apps/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start backend dependencies for E2E
        shell: bash
        run: |
          PSIQAPP_ANALYSIS_WORKER_ENABLED=true PSIQAPP_ANALYSIS_PROVIDER=fake \
            docker compose --env-file .env.example -f infra/compose.yaml up -d --build --wait --wait-timeout 120 postgres backend

      - name: Run E2E checks
        shell: bash
        working-directory: apps/frontend
        run: npm run e2e

      - name: Stop E2E backend
        if: always()
        shell: bash
        run: docker compose --env-file .env.example -f infra/compose.yaml down -v
