services:
  postgres:
    image: postgres:18.6
    container_name: psiqapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env or environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env or environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or environment}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - psiqapp-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: psiqapp-backend
    restart: unless-stopped
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env or environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env or environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or environment}
      PSIQAPP_ANALISE_WORKER_ENABLED: ${PSIQAPP_ANALISE_WORKER_ENABLED:-false}
      PSIQAPP_ANALISE_PROVIDER: ${PSIQAPP_ANALISE_PROVIDER:-fake}
      PSIQAPP_GOOGLE_AGENDA_CLIENT_ID: ${PSIQAPP_GOOGLE_AGENDA_CLIENT_ID:-}
      PSIQAPP_GOOGLE_AGENDA_CLIENT_SECRET: ${PSIQAPP_GOOGLE_AGENDA_CLIENT_SECRET:-}
      PSIQAPP_GOOGLE_AGENDA_REDIRECT_URI: ${PSIQAPP_GOOGLE_AGENDA_REDIRECT_URI:-http://127.0.0.1:8080/api/v1/integracoes/google-agenda/callback}
      PSIQAPP_GOOGLE_AGENDA_FRONTEND_URI: ${PSIQAPP_GOOGLE_AGENDA_FRONTEND_URI:-http://127.0.0.1:5173/agenda}
      PSIQAPP_GOOGLE_AGENDA_ENCRYPTION_KEY: ${PSIQAPP_GOOGLE_AGENDA_ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
    container_name: psiqapp-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  psiqapp-postgres-data:
    name: psiqapp-postgres-data
