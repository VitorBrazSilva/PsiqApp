spring:
  application:
    name: psiqapp-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  mvc:
    log-request-details: false
server:
  address: ${BACKEND_HOST:127.0.0.1}
  port: ${BACKEND_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    accesslog:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /api/v1
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
      group:
        readiness:
          include: readinessState,db
  health:
    readinessstate:
      enabled: true
springdoc:
  api-docs:
    path: /api/v1/openapi
  paths-to-match: /api/v1/**
psiqapp:
  analysis:
    worker:
      enabled: ${PSIQAPP_ANALYSIS_WORKER_ENABLED:false}
      poll-interval: ${PSIQAPP_ANALYSIS_WORKER_POLL_INTERVAL:2s}
      call-timeout: ${PSIQAPP_ANALYSIS_CALL_TIMEOUT:120s}
      attempt-budget: ${PSIQAPP_ANALYSIS_ATTEMPT_BUDGET:180s}
      lease-ttl: ${PSIQAPP_ANALYSIS_LEASE_TTL:240s}
      max-attempts: ${PSIQAPP_ANALYSIS_MAX_ATTEMPTS:3}
      backoff-initial: ${PSIQAPP_ANALYSIS_BACKOFF_INITIAL:5s}
      backoff-final: ${PSIQAPP_ANALYSIS_BACKOFF_FINAL:20s}
    provider:
      type: ${PSIQAPP_ANALYSIS_PROVIDER:fake}
      model: ${OPENAI_MODEL:gpt-5.6-terra}
